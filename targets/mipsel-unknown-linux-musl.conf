# Ingenic JZ4770 handhelds (REG-Linux board "jz4770": RG350, RG280V, GCW Zero).
#
# Rust's built-in mipsel-unknown-linux-musl target is soft-float
# ("+mips32r2,+soft-float"). The board's C toolchain, its musl and every C
# library are hard-float with the "fpxx" FP ABI (readelf -A: "Hard float
# (32-bit CPU, Any FPU)"). A soft-float std passes every f32/f64 to C in the
# wrong registers (libm's sin(0.5) came back as a denormal near zero), so std
# is built with the C side's FP ABI. Every crate of the board must be built
# with the same flags: REG-Linux passes them through
# CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS.
#
# rustc warns "unknown and unstable feature specified for -Ctarget-feature"
# for these; it still hands them to LLVM. check-fp-abi fails the build if a
# future rustc stops honouring them.
TARGET_RUSTFLAGS="-Ctarget-feature=-soft-float,+fpxx,+nooddspreg"
EXPECT_FP_ABI="Hard float (32-bit CPU, Any FPU)"
# Part of the tarball name, so it can never be mistaken for a stock std
VARIANT="fpxx"
